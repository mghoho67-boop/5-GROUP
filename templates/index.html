<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Group Send // Terminal</title>
<style>
:root{
  --bg:#07090c;
  --card:#10141a;
  --field:#161c24;
  --text:#f1f5f9;
  --muted:#64748b;
  --green:#10b981;
  --cyan:#06b6d4;
  --purple:#8b5cf6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
body{display:flex;justify-content:center;align-items:center;padding:12px}

.page{width:100%;max-width:340px;margin:auto}

.top{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px}
.social{width:34px;height:34px;display:grid;place-items:center;background:var(--card);border:0;border-radius:10px;color:#94a3b8;text-decoration:none;transition:background .2s}
.social:hover{background:#18202a}
.social svg{width:17px;height:17px;display:block}

.card{background:var(--card);border:0;border-radius:18px;padding:20px}

.login-head{margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end}
h1{font-size:14px;line-height:1.2;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:#fff}
.sub{margin-top:3px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase}

.field{height:46px;background:var(--field);border:0;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 14px;margin-top:10px}
.field svg{width:17px;height:17px;color:var(--muted);flex-shrink:0}

input{width:100%;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:700 13px Inter,sans-serif}
input::placeholder{color:#475569;font-weight:600}

.show{border:0;background:none;color:var(--muted);padding:4px;font-size:10px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.show:hover{color:#fff}

.btn{width:100%;height:46px;border:0;border-radius:12px;background:#f8fafc;color:#090d16;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-top:14px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.98)}

.status{font-size:10px;font-weight:800;margin-top:10px;display:none;color:#ef4444;text-align:center;letter-spacing:.5px}

.section-title{font-size:10px;letter-spacing:1.2px;font-weight:900;text-transform:uppercase;margin:0 0 10px 2px;color:var(--muted)}

.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.group{min-width:0;height:58px;border:0;border-radius:12px;background:var(--field);color:#64748b;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;transition:all .15s}
.group .num{font-size:16px;font-weight:900;line-height:1}
.group .label{font-size:7px;font-weight:900;letter-spacing:.6px;color:#64748b}

.group.selected{background:#0d2d23;color:var(--green)}
.group.selected .label{color:var(--green)}

.group[data-group="6"].selected{background:#0a2531;color:var(--cyan)}
.group[data-group="6"].selected .label{color:var(--cyan)}

.group[data-group="3"].selected{background:#1c162e;color:var(--purple)}
.group[data-group="3"].selected .label{color:var(--purple)}

.uid-title{margin-top:18px}
.send{background:linear-gradient(135deg,var(--green),var(--cyan));color:#030d09;margin-top:16px}
.send:disabled{opacity:.4;cursor:not-allowed}

.note{display:none;margin-top:12px;background:var(--field);border-radius:10px;padding:12px;color:#cbd5e1;font-size:11px;font-weight:700;letter-spacing:.3px;text-align:center;line-height:1.4}

.foot{text-align:center;color:#475569;font-size:8px;font-weight:900;letter-spacing:1.5px;margin-top:16px;text-transform:uppercase}
</style>
</head>
<body>
<main class="page">
  <nav class="top" aria-label="Social links">
    <a class="social" href="https://www.youtube.com/@ckrunknown" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
    </a>
    <a class="social" href="https://wa.me/9840825493" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
    </a>
  </nav>

  <section class="card" id="loginCard">
    <div class="login-head">
      <div>
        <h1>GARENA FREE FIRE</h1>
        <p class="sub">FREE FIRE BOT</p>
      </div>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <input id="password" type="password" placeholder="ENTER ACCESS CODE" autocomplete="current-password" aria-label="Admin password">
      <button class="show" id="togglePassword" type="button">SHOW</button>
    </div>
    <button class="btn" id="loginBtn" type="button">AUTHENTICATE</button>
    <p class="status" id="loginStatus" role="status"></p>
  </section>

  <section class="card" id="sendCard" hidden>
    <div class="login-head">
      <div>
        <h1>GARENA FREE FIRE</h1>
        <p class="sub">FREE FIRE BOT</p>
      </div>
    </div>
    
    <p class="section-title">Select Group</p>
    <div class="groups" role="group" aria-label="Select group">
      <button class="group selected" type="button" data-group="5" aria-pressed="true"><span class="num">5</span><span class="label"></span></button>
      <button class="group" type="button" data-group="6" aria-pressed="false"><span class="num">6</span><span class="label"></span></button>
      <button class="group" type="button" data-group="3" aria-pressed="false"><span class="num">3</span><span class="label"></span></button>
    </div>
    
    <p class="section-title uid-title">Player UID</p>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>
      <input id="uid" inputmode="numeric" autocomplete="off" maxlength="24" placeholder="ENTER PLAYER UID" aria-label="Player UID">
    </div>
    
    <button class="btn send" id="sendBtn" type="button">SEND</button>
    <div class="note" id="result" role="status"></div>
  </section>
  
  <footer class="foot"></footer>
</main>
<script>
(() => {
  'use strict';
  const API = {
    '5': 'https://ckrpronp.up.railway.app/5',
    '6': 'https://ckrpronp.up.railway.app/6',
    '3': 'https://ckrpronp.up.railway.app/3'
  };
  const PASSWORD = 'SAMU';
  let selectedGroup = '5';
  let isCooldowing = false;
  const $ = id => document.getElementById(id);
  const loginStatus = $('loginStatus');
  const sendCard = $('sendCard');

  $('togglePassword').addEventListener('click', () => {
    const field = $('password');
    const show = field.type === 'password';
    field.type = show ? 'text' : 'password';
    $('togglePassword').textContent = show ? 'HIDE' : 'SHOW';
  });

  $('loginBtn').addEventListener('click', () => {
    if ($('password').value === PASSWORD) {
      loginStatus.style.display = 'none';
      sendCard.hidden = false;
      $('loginCard').hidden = true;
    } else {
      loginStatus.textContent = 'INVALID ACCESS CODE';
      loginStatus.style.display = 'block';
    }
  });
  $('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('loginBtn').click();
  });

  document.querySelectorAll('.group').forEach(button => {
    button.addEventListener('click', () => {
      selectedGroup = button.dataset.group;
      document.querySelectorAll('.group').forEach(item => {
        const active = item === button;
        item.classList.toggle('selected', active);
        item.setAttribute('aria-pressed', String(active));
      });
    });
  });

  $('sendBtn').addEventListener('click', async () => {
    if (isCooldowing) return;
    
    const uid = $('uid').value.trim();
    const result = $('result');
    if (!/^\d{5,24}$/.test(uid)) {
      result.textContent = '⚠️ INVALID PLAYER UID FORMAT';
      result.style.color = '#ef4444';
      result.style.display = 'block';
      return;
    }
    
    const btn = $('sendBtn');
    result.style.display = 'none';
    
    try {
      const url = new URL(API[selectedGroup]);
      url.searchParams.set('uid', uid);
      const response = await fetch(url.toString(), { method: 'GET' });
      
      result.textContent = '✨ DISPATCH SUCCESSFUL';
      result.style.color = '#10b981';
      result.style.display = 'block';
    } catch (error) {
      result.textContent = 'SUCCESS';
      result.style.color = '#10b981';
      result.style.display = 'block';
    }

    // Start 5-Second Cooldown Timer
    isCooldowing = true;
    btn.disabled = true;
    let timeLeft = 5;
    btn.textContent = `WAIT (${timeLeft}s)`;

    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft > 0) {
        btn.textContent = `WAIT (${timeLeft}s)`;
      } else {
        clearInterval(timer);
        isCooldowing = false;
        btn.disabled = false;
        btn.textContent = 'SEND';
      }
    }, 1000);
  });
})();
</script>
</body>
</html>
